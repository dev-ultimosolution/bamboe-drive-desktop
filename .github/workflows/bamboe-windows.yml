#
# Builds the Bamboe Drive Windows installer (.msi).
# Based on upstream nextcloud/desktop windows-build-and-test.yml.
name: Bamboe Drive Windows

on:
  workflow_dispatch:
  push:
    tags: ['bamboe-v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach the MSI to the GitHub release for tag builds

jobs:
  build:
    name: Build MSI
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
      PYTHON_VERSION: '3.12'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: ilammy/msvc-dev-cmd@v1 # uuidgen for make-msi.bat

      - name: Resolve Craft dependency revisions
        id: craft-revisions
        shell: pwsh
        run: |
          function configValue($key) {
              $escapedKey = [regex]::Escape($key)
              $matches = @(Select-String -Path "${{ env.CRAFT_MASTER_CONFIG }}" -Pattern "^\s*$escapedKey\s*=\s*(.+?)\s*$")
              if($matches.Count -ne 1) { throw "Expected exactly one $key value in craftmaster.ini." }
              return $matches[0].Matches[0].Groups[1].Value.Trim()
          }
          $craftRevision = configValue "CraftRevision"
          $kdeBlueprintRef = configValue "craft/craft-blueprints-kde.revision"
          $nextcloudBlueprintRef = configValue "craft/craft-blueprints-nextcloud.revision"
          function remoteRevision($repository, $ref) {
              $revision = git ls-remote $repository $ref
              if($LASTEXITCODE -ne 0 -or !$revision) { throw "Could not resolve $ref from $repository." }
              return ($revision -split '\s+')[0]
          }
          $kdeBlueprintRevision = remoteRevision "https://github.com/nextcloud/craft-blueprints-kde.git" "refs/heads/$kdeBlueprintRef"
          $nextcloudBlueprintRevision = remoteRevision "https://github.com/nextcloud/craft-blueprints-nextcloud.git" "refs/heads/$nextcloudBlueprintRef"
          @(
              "kde_ref=$kdeBlueprintRef"
              "nextcloud_ref=$nextcloudBlueprintRef"
              "key=$craftRevision-$kdeBlueprintRevision-$nextcloudBlueprintRevision"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore Craft dependencies
        id: craft-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.CRAFT_MASTER_CONFIG }}
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-bamboe-craft-v1-${{ env.CRAFT_TARGET }}-python-${{ env.PYTHON_VERSION }}-${{ steps.craft-revisions.outputs.key }}

      - name: Install Craft Master with client dependencies
        if: steps.craft-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://github.com/KDE/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|${{ steps.craft-revisions.outputs.kde_ref }}|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|${{ steps.craft-revisions.outputs.nextcloud_ref }}|"
          craft craft
          craft --install-deps nextcloud-client

      - name: Save Craft dependencies
        if: steps.craft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.CRAFT_MASTER_CONFIG }}
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-bamboe-craft-v1-${{ env.CRAFT_TARGET }}-python-${{ env.PYTHON_VERSION }}-${{ steps.craft-revisions.outputs.key }}

      - name: Install Inkscape and WiX Toolset 3
        shell: pwsh
        run: |
          choco install inkscape -y --no-progress
          choco install wixtoolset -y --no-progress
          $wix = (Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1).FullName
          if (-not $wix) { throw "WiX Toolset v3 not found" }
          "WIX=$wix\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          craft --options nextcloud-client.buildTests=False --src-dir ${{ github.workspace }} nextcloud-client

      - name: Collect application files
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          # Upstream blueprint uses os.path in createPackage() without importing os.
          $blueprint = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\nextcloud-client.py"
          $text = Get-Content -Raw $blueprint
          if ($text -notmatch '(?m)^import os\s*$') { Set-Content -NoNewline -Path $blueprint -Value ("import os`n" + $text) }
          # The blueprint blacklist strips every bin\*.exe except nextcloud*.exe; keep ours.
          $blacklist = Join-Path (Split-Path $blueprint) "blacklist.txt"
          $bl = Get-Content -Raw $blacklist
          if ($bl -notmatch 'bamboedrive') {
              $bl = $bl.Replace('(?!(nextcloud|nextcloudcmd|', '(?!(bamboedrive|bamboedrivecmd|nextcloud|nextcloudcmd|')
              if ($bl -notmatch 'bamboedrive') { throw "Could not patch $blacklist" }
              Set-Content -NoNewline -Path $blacklist -Value $bl
          }
          # PortablePackager gathers the client plus every runtime dependency
          # into build\nextcloud-client\archive, which the MSI harvests.
          craft --options nextcloud-client.buildTests=False --options "[Packager]PackageType=PortablePackager" --src-dir ${{ github.workspace }} --package nextcloud-client
          $archive = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\build\nextcloud-client\archive"
          Get-ChildItem $archive | Format-Table Name
          Write-Host "EXE in archive: $((Get-ChildItem $archive -Recurse -Filter *.exe | ForEach-Object { $_.FullName.Substring($archive.Length) }) -join ', ')"
          $build = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\build\nextcloud-client"
          Get-ChildItem $build -Recurse -Filter bamboedrive*.exe -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "FOUND $($_.FullName)" }
          if (Test-Path "$build\blacklist.txt") { Write-Host "BLACKLIST:"; Get-Content "$build\blacklist.txt" }
          $exe = Get-ChildItem $archive -Recurse -Filter bamboedrive.exe | Select-Object -First 1
          if (-not $exe) { throw "bamboedrive.exe not found under $archive" }
          $msi = Get-ChildItem $archive -Recurse -Filter make-msi.bat | Select-Object -First 1
          if (-not $msi) { throw "make-msi.bat not found under $archive" }
          Get-ChildItem $archive -Directory | ForEach-Object { Write-Host "DIR $($_.Name): $((Get-ChildItem $_.FullName | Select-Object -First 12 | ForEach-Object Name) -join ', ')" }
          Get-ChildItem $archive -Recurse -Include *.ico,qt.conf,qwindows.dll,*.VisualElementsManifest.xml | ForEach-Object { Write-Host "FILE $($_.FullName.Substring($archive.Length))" }
          Write-Host "MSI scripts: $($msi.DirectoryName)"
          # Windows layout is flat: the client looks for i18n\ and sync-exclude.lst
          # next to bamboedrive.exe, Qt plugins are already under bin\.
          $stage = "${{ github.workspace }}\stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item "$($exe.DirectoryName)\*" $stage -Recurse -Force
          foreach ($d in @("i18n", "share", "etc", "lib")) { if (Test-Path "$archive\$d") { Copy-Item "$archive\$d" $stage -Recurse -Force } }
          Get-ChildItem "$archive\config" -Recurse -Filter sync-exclude.lst | Select-Object -First 1 | Copy-Item -Destination $stage
          $ico = Get-ChildItem "$build\work\build" -Recurse -Filter BamboeDrive.ico | Select-Object -First 1
          if (-not $ico) { throw "BamboeDrive.ico not found in build dir" }
          Copy-Item $ico.FullName $stage
          foreach ($f in @("bamboedrive.exe", "BamboeDrive.ico", "sync-exclude.lst", "i18n", "platforms\qwindows.dll")) {
              if (-not (Test-Path "$stage\$f")) { throw "Staging is missing $f" }
          }
          Write-Host "Staged $((Get-ChildItem $stage -Recurse -File).Count) files"
          "APP_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSI_DIR=$($msi.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          Set-Location $env:MSI_DIR
          # make-msi.bat ends with "exit", so run it in its own cmd process.
          & cmd.exe /c "make-msi.bat `"$env:APP_DIR`" 2>&1"
          if ($LASTEXITCODE -ne 0) { throw "make-msi.bat failed with $LASTEXITCODE" }
          $out = Get-ChildItem -Filter *.msi
          if (-not $out) { Get-ChildItem | Format-Table Name, Length; throw "No MSI produced" }
          $out | Format-Table Name, Length

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: bamboe-drive-windows
          path: ${{ env.MSI_DIR }}\*.msi
          if-no-files-found: error

      - name: Attach MSI to release
        if: startsWith(github.ref, 'refs/tags/bamboe-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MSI_DIR }}\*.msi
