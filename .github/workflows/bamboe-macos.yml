#
# Builds the Bamboe Drive macOS app with upstream's mac-crafter (KDE Craft).
# Stage 1: unsigned test builds (Apple Silicon and Intel), uploaded as workflow artifacts.
# Stage 2: both are merged into one universal app and packed into a disk image (.dmg), still unsigned.
# Signing, notarisation and the auto-updater follow later.
name: Bamboe Drive macOS

on:
  workflow_dispatch:
  push:
    branches: ['macos-build']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build app (${{ matrix.arch }}, unsigned)
    runs-on: macos-26
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      APP_NAME: Bamboe Drive
      ARCH: ${{ matrix.arch }}
      BUILD_PATH: ${{ github.workspace }}/mc-build
      PRODUCT_PATH: ${{ github.workspace }}/mc-product
      BLUEPRINT_REF: stable-34.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # craftmaster.ini pins Paths/Python for macos-clang-arm64 to this exact version.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          python3 --version

      - name: Install Inkscape
        run: brew install homebrew/cask/inkscape

      - name: Restore Craft dependencies
        id: craft-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_PATH }}
          key: ${{ runner.os }}-bamboe-maccrafter-v1-${{ env.ARCH }}-${{ env.BLUEPRINT_REF }}-${{ hashFiles('craftmaster.ini') }}

      - name: Build
        working-directory: admin/osx/mac-crafter
        run: |
          swift run mac-crafter build "${{ github.workspace }}" \
            --arch "$ARCH" \
            --app-name "$APP_NAME" \
            --build-path "$BUILD_PATH" \
            --product-path "$PRODUCT_PATH" \
            --kde-blueprints-git-ref "$BLUEPRINT_REF" \
            --client-blueprints-git-ref "$BLUEPRINT_REF" \
            --disable-auto-updater

      - name: Save Craft dependencies
        if: always() && steps.craft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_PATH }}
          key: ${{ runner.os }}-bamboe-maccrafter-v1-${{ env.ARCH }}-${{ env.BLUEPRINT_REF }}-${{ hashFiles('craftmaster.ini') }}

      - name: Inspect app bundle
        run: |
          APP="$PRODUCT_PATH/$APP_NAME.app"
          ls -la "$PRODUCT_PATH"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c Print "$APP/Contents/Info.plist" | head -60
          ls "$APP/Contents/MacOS" | head -40
          lipo -archs "$APP/Contents/MacOS/"* 2>/dev/null | sort | uniq -c
          codesign -dv "$APP" 2>&1 | head -20 || true
          # The command line tool must resolve its libraries inside the bundle.
          otool -L "$APP/Contents/MacOS/bamboedrivecmd" | head -30
          if otool -L "$APP/Contents/MacOS/bamboedrivecmd" | grep -q "$BUILD_PATH"; then echo "bamboedrivecmd still links into the build tree"; exit 1; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$PRODUCT_PATH/BamboeDrive-macos-$ARCH-unsigned.zip"
          shasum -a 256 "$PRODUCT_PATH"/*.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: bamboe-drive-macos-${{ env.ARCH }}-unsigned
          path: ${{ env.PRODUCT_PATH }}/*.zip
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-crafter-logs
          path: ~/Library/Logs/mac-crafter
          if-no-files-found: ignore

  package:
    name: Universal app + disk image (unsigned)
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_NAME: Bamboe Drive
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: bamboe-drive-macos-*-unsigned
          path: parts

      - name: Unpack both builds
        run: |
          find parts -name '*.zip' -print
          for arch in arm64 x86_64; do
            mkdir -p "apps/$arch"
            ditto -x -k parts/bamboe-drive-macos-$arch-unsigned/*.zip "apps/$arch"
            test -d "apps/$arch/$APP_NAME.app"
          done

      - name: Merge into a universal app
        run: |
          python3 admin/osx/make_universal.py "apps/x86_64/$APP_NAME.app" "apps/arm64/$APP_NAME.app" universal | tee merge.log
          if grep -q "Could not merge" merge.log; then echo "Some binaries exist for one architecture only"; grep "Could not merge" merge.log; exit 1; fi
          APP="universal/$APP_NAME.app"
          for f in "$APP/Contents/MacOS/"*; do
            file "$f" | grep -q "Mach-O" || continue
            echo "$(basename "$f"): $(lipo -archs "$f")"
            lipo -archs "$f" | grep -q arm64 && lipo -archs "$f" | grep -q x86_64 || { echo "$f is not universal"; exit 1; }
          done

      # Merging invalidates the linker signatures; Apple Silicon refuses to run unsigned code,
      # so sign ad hoc (no identity). Real signing replaces this later.
      - name: Ad hoc sign
        run: |
          APP="universal/$APP_NAME.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"

      - name: Create disk image
        run: |
          APP="universal/$APP_NAME.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")
          DMG="BamboeDrive-$VERSION.$BUILD-macos-universal-unsigned.dmg"
          brew install create-dmg
          # create-dmg arranges the window with Finder, which can fail on a CI runner; fall back to a plain image.
          if ! create-dmg --volname "$APP_NAME" --filesystem APFS --app-drop-link 513 37 --window-size 787 276 "$DMG" "$APP"; then
            echo "create-dmg failed, building a plain disk image"
            rm -f "$DMG"
            mkdir stage
            cp -a "$APP" stage/
            ln -s /Applications stage/Applications
            hdiutil create -volname "$APP_NAME" -srcfolder stage -fs APFS -format UDZO "$DMG"
          fi
          hdiutil verify "$DMG"
          ls -la "$DMG"
          shasum -a 256 "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: bamboe-drive-macos-universal-unsigned-dmg
          path: ${{ env.DMG }}
          if-no-files-found: error
          compression-level: 0
